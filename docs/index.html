<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>국내 주식 대시보드</title>
<style>
:root{--bg:#eef1f5;--surface:#fff;--ink:#14202e;--muted:#667385;--line:#dbe1e9;--up:#d4333f;--down:#2b6cd4;--chip:#e6ebf2;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#0e141b;--surface:#16202b;--ink:#e8edf3;--muted:#8c9aab;--line:#27343f;--up:#ff6670;--down:#6ea3ff;--chip:#202c39;color-scheme:dark}}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.55 system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif}
.wrap{max-width:1000px;margin:0 auto;padding:26px 18px 56px}
header{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:18px;flex-wrap:wrap}
h1{font-size:18px;margin:0;font-weight:600}h2{font-size:15px;margin:24px 0 10px;font-weight:600}
button{font:inherit;color:inherit}
.btn{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 12px;cursor:pointer}
.btn[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
:focus-visible{outline:2px solid var(--down);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}.label{color:var(--muted);font-size:13px}
.up{color:var(--up)}.down{color:var(--down)}
.idx{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px}
.idx .v{font-size:28px;font-weight:600;letter-spacing:-.02em;line-height:1.2}
.tablebox{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:720px}
th,td{padding:10px 12px;text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{font-weight:500;color:var(--muted);font-size:13px;border-bottom:1px solid var(--line)}
tr+tr td{border-top:1px solid var(--line)}tbody tr.sel{background:var(--chip)}
.pick{background:none;border:0;padding:0;cursor:pointer;font-weight:500;text-align:left}
.tabs{display:flex;gap:6px;margin:6px 0}
svg{display:block;width:100%;height:auto}.axis{fill:var(--muted);font-size:11px}
.empty{padding:28px 18px;text-align:center;color:var(--muted)}
.note{margin-top:20px;font-size:13px;color:var(--muted)}
@media (max-width:700px){.idx{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
  <header><h1>국내 주식 대시보드</h1><span class="label num" id="stamp"></span></header>
  <div id="msg" class="empty" hidden></div>
  <div id="app" hidden>
    <h2 style="margin-top:0">시장 지수</h2>
    <div class="idx" id="idx"></div>
    <h2>관심 종목</h2>
    <div class="tablebox"><table>
      <thead><tr><th>종목</th><th>현재가</th><th>등락률</th><th>PER</th><th>PBR</th><th>배당(%)</th><th>시가총액(조)</th></tr></thead>
      <tbody id="rows"></tbody>
    </table></div>
    <h2>주가 추이</h2>
    <div class="card">
      <div class="label" id="ctitle"></div>
      <div class="tabs" id="tabs"></div>
      <div id="chart"></div>
    </div>
  </div>
  <p class="note">매 거래일 장 마감 후 갱신되는 야후 파이낸스 기준 데이터이며 지연되거나 부정확할 수 있어요. 투자 판단의 근거로 쓰지 마세요. 색상은 한국식(상승 빨강, 하락 파랑)입니다.</p>
</div>
<script>
(function(){
  var DAYS=[30,90,180,365],D=null,sel=0,days=90,$=function(i){return document.getElementById(i)};
  function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
  function sgn(v){return v>0?"up":v<0?"down":""}
  function fm(v,d){return v==null?"-":Number(v).toLocaleString("ko-KR",{minimumFractionDigits:d||0,maximumFractionDigits:d||0})}
  function pct(v){return v==null?"-":(v>0?"+":"")+Number(v).toFixed(2)+"%"}
  function msg(t){var m=$("msg");m.textContent=t;m.hidden=false}

  function renderIdx(){
    var b=$("idx");b.innerHTML="";
    (D.indices||[]).forEach(function(x){
      var d=document.createElement("div");d.className="card";
      var diff=x.price!=null&&x.prev!=null?x.price-x.prev:null;
      d.innerHTML='<div class="label">'+esc(x.name)+'</div><div class="v num">'+fm(x.price,2)+'</div><div class="num '+sgn(x.change_pct)+'">'+
        (diff!=null?(diff>0?"+":"")+fm(diff,2)+" ":"")+"("+pct(x.change_pct)+")</div>";
      b.appendChild(d);
    });
    if(!b.children.length)b.innerHTML='<div class="label">지수 데이터가 없어요.</div>';
  }
  function renderRows(){
    var tb=$("rows");tb.innerHTML="";
    D.stocks.forEach(function(s,i){
      var tr=document.createElement("tr");if(i===sel)tr.className="sel";
      tr.innerHTML='<td><button class="pick" data-i="'+i+'">'+esc(s.name)+'</button> <span class="label">'+esc(s.code)+'</span></td>'+
        '<td class="num">'+fm(s.price)+'</td><td class="num '+sgn(s.change_pct)+'">'+pct(s.change_pct)+'</td>'+
        '<td class="num">'+fm(s.per,1)+'</td><td class="num">'+fm(s.pbr,2)+'</td><td class="num">'+fm(s.div_yield,2)+
        '</td><td class="num">'+(s.market_cap?fm(s.market_cap/1e12,1):"-")+'</td>';
      tb.appendChild(tr);
    });
  }
  function renderChart(){
    var s=D.stocks[sel];$("ctitle").textContent=s.name+" 종가 추이";
    var tabs=$("tabs");tabs.innerHTML="";
    DAYS.forEach(function(d){var b=document.createElement("button");b.className="btn";b.type="button";b.textContent=d+"일";b.setAttribute("aria-pressed",d===days);b.onclick=function(){days=d;renderChart()};tabs.appendChild(b)});
    var rows=(s.history||[]).slice(-days),box=$("chart");
    if(rows.length<2){box.innerHTML='<div class="empty">차트 데이터가 없어요.</div>';return}
    var W=640,H=220,L=60,R=12,T=14,B=26,min=Infinity,max=-Infinity;
    rows.forEach(function(r){if(r[1]<min)min=r[1];if(r[1]>max)max=r[1]});
    var pad=(max-min||1)*.08;min-=pad;max+=pad;
    function X(i){return L+(W-L-R)*i/(rows.length-1)}function Y(v){return T+(H-T-B)*(1-(v-min)/(max-min))}
    var pts=rows.map(function(r,i){return X(i).toFixed(1)+","+Y(r[1]).toFixed(1)}).join(" ");
    var col=rows[rows.length-1][1]>=rows[0][1]?"var(--up)":"var(--down)",g="";
    for(var k=0;k<=3;k++){var v=min+(max-min)*k/3,y=Y(v);g+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+y+'" y2="'+y+'" stroke="var(--line)"/><text class="axis" x="'+(L-6)+'" y="'+(y+4)+'" text-anchor="end">'+fm(v)+'</text>'}
    box.innerHTML='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(s.name)+' 종가 추이">'+g+'<polyline fill="none" stroke="'+col+'" stroke-width="2" stroke-linejoin="round" points="'+pts+'"/><text class="axis" x="'+L+'" y="'+(H-6)+'">'+esc(rows[0][0])+'</text><text class="axis" x="'+(W-R)+'" y="'+(H-6)+'" text-anchor="end">'+esc(rows[rows.length-1][0])+'</text></svg>';
  }
  $("rows").addEventListener("click",function(e){var i=e.target.getAttribute("data-i");if(i===null)return;sel=+i;renderRows();renderChart()});

  fetch("data.json?t="+Date.now()).then(function(r){if(!r.ok)throw new Error(r.status);return r.json()}).then(function(d){
    if(!d||!d.stocks||!d.stocks.length)throw new Error("empty");
    D=d;$("stamp").textContent="마지막 갱신 "+(d.updated||"-");$("app").hidden=false;renderIdx();renderRows();renderChart();
  }).catch(function(){msg("data.json을 불러오지 못했어요. 저장소의 Actions 탭에서 update-data를 한 번 실행했는지 확인해 주세요.")});
})();
</script>
</body>
</html>
